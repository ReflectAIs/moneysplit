<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option 3: Two overlapping circles (Venn) — money meeting people -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#f6f6f6"/>

  <!-- Left circle: money -->
  <circle cx="200" cy="256" r="130" fill="none" stroke="#808000" stroke-width="10"/>
  <text x="175" y="285" font-family="system-ui, sans-serif" font-size="130" font-weight="700" fill="#808000" text-anchor="middle">$</text>

  <!-- Right circle: people -->
  <circle cx="312" cy="256" r="130" fill="none" stroke="#0a0a0a" stroke-width="10"/>
  <circle cx="330" cy="235" r="28" fill="#0a0a0a"/>
  <circle cx="330" cy="295" r="28" fill="#0a0a0a"/>

  <!-- Overlap area is empty — the split happens in the middle -->
</svg>