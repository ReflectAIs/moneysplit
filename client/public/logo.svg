<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="oliveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#808000"/>
      <stop offset="100%" stop-color="#6b6b00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="220" fill="#f6f6f6" rx="40"/>
  <rect x="36" y="36" width="440" height="440" rx="40" fill="#f6f6f6"/>
  <!-- Coin circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#808000" stroke-width="8"/>
  <!-- Split line (diagonal) -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#0a0a0a" stroke-width="6"/>
  <!-- Left half: dollar/currency sign -->
  <text x="180" y="280" font-family="system-ui, sans-serif" font-size="160" font-weight="700" fill="#808000" text-anchor="middle">$</text>
  <!-- Right half: arrow indicating sharing -->
  <path d="M 320 240 L 380 240 L 380 200 L 340 200" fill="none" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="380,240 390,230 390,250" fill="#0a0a0a"/>
  <!-- Small dots representing people -->
  <circle cx="140" cy="140" r="12" fill="#808000"/>
  <circle cx="372" cy="140" r="12" fill="#0a0a0a"/>
  <circle cx="140" cy="372" r="12" fill="#0a0a0a"/>
  <circle cx="372" cy="372" r="12" fill="#808000"/>
</svg>