<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f6f6"/>
      <stop offset="100%" stop-color="#e7e7e7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Outer coin ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#808000" stroke-width="10"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0a0a0a" stroke-width="4"/>
  <!-- Vertical split line -->
  <line x1="256" y1="116" x2="256" y2="396" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Left half: $ sign -->
  <text x="185" y="285" font-family="Georgia, serif" font-size="170" font-weight="bold" fill="#808000" text-anchor="middle">$</text>
  <!-- Right half: arrow pointing right (splitting/sharing) -->
  <path d="M 310 240 L 370 240" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <polygon points="370,240 380,230 380,250" fill="#0a0a0a"/>
  <!-- Two small dots representing people on each side -->
  <circle cx="175" cy="175" r="14" fill="#808000"/>
  <circle cx="337" cy="175" r="14" fill="#0a0a0a"/>
  <circle cx="175" cy="337" r="14" fill="#0a0a0a"/>
  <circle cx="337" cy="337" r="14" fill="#808000"/>
</svg>