<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#f6f6f6"/>

  <!-- Two overlapping circles forming a Venn-diagram split (splitting/sharing) -->
  <circle cx="220" cy="256" r="140" fill="none" stroke="#808000" stroke-width="12"/>
  <circle cx="292" cy="256" r="140" fill="none" stroke="#0a0a0a" stroke-width="12"/>

  <!-- Dollar sign in left circle -->
  <text x="195" y="285" font-family="system-ui, sans-serif" font-size="160" font-weight="700" fill="#808000" text-anchor="middle">$</text>

  <!-- Simple dot/person in right circle -->
  <circle cx="320" cy="256" r="32" fill="#0a0a0a"/>
</svg>