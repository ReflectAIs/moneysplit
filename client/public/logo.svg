<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#f6f6f6"/>

  <!-- Left person (olive green) — abstract figure: head + body -->
  <circle cx="170" cy="210" r="38" fill="#808000"/>
  <rect x="145" y="248" width="50" height="90" rx="12" fill="#808000"/>

  <!-- Right person (ink) — abstract figure -->
  <circle cx="342" cy="210" r="38" fill="#0a0a0a"/>
  <rect x="317" y="248" width="50" height="90" rx="12" fill="#0a0a0a"/>

  <!-- Coin between them -->
  <circle cx="256" cy="270" r="48" fill="none" stroke="#808000" stroke-width="6"/>
  <text x="256" y="283" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#808000" text-anchor="middle">$</text>
</svg>